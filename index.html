<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallety</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- SweetAlert2 (สำหรับ Popup ยืนยัน) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase SDK (v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

</head>

<body data-aos="flip-right"> 

    <!-- Container -->
    <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Header -->
        <header class="text-center py-4 bg-white rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800">
                <i class="fa-solid fa-wallet text-indigo-600 mr-2"></i>บันทึกรายรับ-รายจ่ายประจำสัปดาห์
            </h1>
            <p class="text-sm text-slate-500 mt-1">วางแผนการเงินและติดตามรายการซื้อของได้อย่างง่ายดาย</p>
        </header>

        <!-- Dashboard Summary -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Income Card -->
            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 shadow-sm">
                <div class="flex justify-between items-center text-emerald-700 font-semibold mb-2">
                    <span>รายรับรวม</span>
                    <i class="fa-solid fa-circle-arrow-down text-xl"></i>
                </div>
                <div id="totalIncome" class="text-2xl font-bold text-emerald-600">฿0.00</div>
            </div>

            <!-- Expense Card -->
            <div class="bg-rose-50 border border-rose-200 rounded-2xl p-5 shadow-sm">
                <div class="flex justify-between items-center text-rose-700 font-semibold mb-2">
                    <span>รายจ่ายรวม</span>
                    <i class="fa-solid fa-circle-arrow-up text-xl"></i>
                </div>
                <div id="totalExpense" class="text-2xl font-bold text-rose-600">฿0.00</div>
            </div>

            <!-- Balance Card -->
            <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-5 shadow-sm">
                <div class="flex justify-between items-center text-indigo-700 font-semibold mb-2">
                    <span>เงินคงเหลือสุทธิ</span>
                    <i class="fa-solid fa-scale-balanced text-xl"></i>
                </div>
                <div id="totalBalance" class="text-2xl font-bold text-indigo-600">฿0.00</div>
            </div>
        </div>

        <!-- Forms Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- 1. Add Income -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-emerald-700 mb-4 flex items-center">
                    <i class="fa-solid fa-plus-circle mr-2"></i>เพิ่มเงินที่ได้รับ
                </h2>
                <form id="incomeForm" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">ชื่อรายการ</label>
                        <input type="text" id="incDesc" required placeholder="เช่น เงินเดือน, ค่าขนม"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">จำนวนเงิน (บาท)</label>
                        <input type="number" id="incAmount" min="0" step="0.01" required placeholder="0.00"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <button type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        บันทึกรายรับ
                    </button>
                </form>
            </div>

            <!-- 2. Add Shopping Item -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-amber-600 mb-4 flex items-center">
                    <i class="fa-solid fa-cart-shopping mr-2"></i>ของที่ต้องซื้อ
                </h2>
                <form id="shoppingForm" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">ชื่อของที่จะซื้อ</label>
                        <input type="text" id="shopItem" required placeholder="เช่น ผงซักฟอก, สมุด"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">ราคาประมาณ (บาท)</label>
                        <input type="number" id="shopCost" min="0" step="0.01" placeholder="0.00"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <button type="submit"
                        class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-2 rounded-lg text-sm transition">
                        เพิ่มรายการซื้อของ
                    </button>
                </form>
            </div>

            <!-- 3. Add Expense -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-rose-600 mb-4 flex items-center">
                    <i class="fa-solid fa-minus-circle mr-2"></i>เพิ่มเงินที่จ่ายออก
                </h2>
                <form id="expenseForm" class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">ชื่อรายการ (เลือกจากรายการซื้อของ
                            หรือพิมพ์เอง)</label>
                        <input type="text" id="expDesc" list="shoppingOptions" required
                            placeholder="เลือกรายการ หรือพิมพ์เอง"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rose-500"
                            oninput="onExpenseSelect(this.value)">
                        <datalist id="shoppingOptions">
                            <!-- Populated dynamically via JS -->
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-600 mb-1">จำนวนเงิน (บาท)</label>
                        <input type="number" id="expAmount" min="0" step="0.01" required placeholder="0.00"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                    </div>
                    <button type="submit"
                        class="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        บันทึกรายจ่าย
                    </button>
                </form>
            </div>

        </div>

        <!-- Data Display Lists -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Cashflow List (Incomes & Expenses) -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center justify-between">
                    <span><i class="fa-solid fa-list-check mr-2 text-indigo-600"></i>ประวัติรายรับ - รายจ่าย</span>
                    <button onclick="clearCashflow()" class="text-xs text-rose-500 hover:underline">ล้างทั้งหมด</button>
                </h2>
                <div class="overflow-y-auto max-h-64 pr-1">
                    <ul id="cashflowList" class="space-y-2 text-sm">
                        <li class="text-slate-400 text-center py-4">กำลังโหลดข้อมูล...</li>
                    </ul>
                </div>
            </div>

            <!-- Shopping List -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center justify-between">
                    <span><i class="fa-solid fa-basket-shopping mr-2 text-amber-500"></i>รายการของที่ต้องซื้อ</span>
                    <button onclick="clearShopping()" class="text-xs text-rose-500 hover:underline">ล้างทั้งหมด</button>
                </h2>
                <div class="overflow-y-auto max-h-64 pr-1">
                    <ul id="shoppingList" class="space-y-2 text-sm">
                        <li class="text-slate-400 text-center py-4">กำลังโหลดข้อมูล...</li>
                    </ul>
                </div>
            </div>

        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script src="app.js"></script>
    <!-- aos js -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
